<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Laskuri</title>
</head>
<body>
  <h2>Ohtulaskuri</h2>
  <div>nappia painettu {{ value }} kertaa</div>
  <form action="/increment" method="POST">
    <button type="submit">
      Paina
    </button>
  </form>
  <form action="/reset" method="POST">
    <button type="submit">
      Nollaa
    </button>
  </form>
  <form action="/set" method="POST">
    <label for="counter-value">Aseta arvo:</label>
    <input id="counter-value" name="value" type="number" step="1" value="{{ input_value }}" required>
    <button type="submit">
      Aseta
    </button>
  </form>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
</body>
</html>
